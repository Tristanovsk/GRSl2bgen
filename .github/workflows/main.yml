name: Pipeline CI

on:
  push:
    branches:
      - feature/dev-ci
    tags:
      - '*'
  pull_request:
    branches:
      - feature/dev-ci
  workflow_dispatch:
    inputs:
      with-quality:
        type: boolean
        default: false


env:
  DOCKER_IMAGE_NAME : "l2bgen"

jobs:

# =============================================================================
# package — Pypi
# =============================================================================
  pypi:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name : Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publication sur Pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}


# =============================================================================
# package — Build & Push
# =============================================================================
  podman-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}"
          export VERSION_OBS2CO=$(grep "^__version__" setup.py | cut -d"'" -f 2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag : $GITHUB_REF_NAME"
            export VERSION_OBS2CO=${GITHUB_REF_NAME};
          fi
          echo "Version OBS2CO -> ${VERSION_OBS2CO}"
          
          podman build \
            --network=host \
            --build-arg IMAGE_SOURCE="" \
            --build-arg no_proxy=cnes.fr \
            --file Dockerfile \
            --tag "${DOCKER_IMAGE_NAME}:${VERSION_OBS2CO}" \
            --tag "${DOCKER_IMAGE_NAME}:latest"
          echo "Build terminé"

      - name: Publication des images sur docker Hub
        if: github.ref_type == 'tag'
        run: |
          echo "On se loggue à docker.io"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io \
              -u "${{ secrets.DOCKERHUB_LOGIN }}" \
              --password-stdin
         
          echo "Tag de l'image pour docker.io"
          echo "podman tag ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}"
           
          podman tag ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}
          podman tag ${DOCKER_IMAGE_NAME}:latest docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:latest
          
          echo "Publication vers docker.io de ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}"
          podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}
          echo "Publication vers docker.io de ${DOCKER_IMAGE_NAME}:latest"
          podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:latest
          echo "Images publiées"

# =============================================================================
# quality
# =============================================================================
  lint:
    if: github.event_name == 'workflow_dispatch' && inputs.with-quality
    needs: podman-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name : Install ruff and mypi
        run: pip install ruff mypy

      - name: Run ruff
        continue-on-error: true
        run: ruff check . --output-format=json > ruff-report.json

      - name: Show Ruff report
        run: |
          ruff --version
          cat ruff-report.json || true

      - run: pip install -r requirements.txt

      - name: Run mypy
        continue-on-error: true
        run: mypy . --junit-xml mypy-report.xml
      
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            ruff-report.json
            mypy-report.xml
          retention-days: 1


  sonar:
    if: github.event_name == 'workflow_dispatch' && inputs.with-quality
    needs: podman-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: debug
        run: |
          echo "SONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }}"
          echo "SONAR_ORGANIZATION=${{ vars.SONAR_ORGANIZATION }}"
          echo "SONAR_PROJECT_KEY=${{ vars.SONAR_PROJECT_KEY }}"
          echo "SONAR_PROJECT_NAME=${{ vars.SONAR_PROJECT_NAME }}"
          echo "SONAR_TOKEN=${{ secrets.SONAR_TOKEN }}"

      - name: Scan Sonar
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -X
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectName=${{ vars.SONAR_PROJECT_NAME }}
            -Dsonar.branch.name=${{ github.ref_name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          

# =============================================================================
# Documentation
# =============================================================================

  doc:
    needs: podman-build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --no-cache-dir --force-reinstall
          python -m pip install sphinx sphinx-rtd-theme
          python -m pip install myst-parser
          python -m pip install sphinx-autoapi

      - name: Compiler la documentation Sphinx en HTML
        run: |
          cd docs
          make html

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            docs/build/html/
          retention-days: 1      

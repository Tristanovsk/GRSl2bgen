name: Pipeline CI

on:
  push:
    branches:
      - 'feature/*'
      - 'release/*'
      - 'hotfix/*'
      - main
      - develop
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - develop

env:
  DOCKER_IMAGE_NAME : "l2bgen"

jobs:

# =============================================================================
# test
# =============================================================================
  python-tests:
   runs-on: ubuntu-latest
   # push of the coverage badge to main
   permissions:
     contents: write
   # all the supported Python versions, each tested even if another one fails
   strategy:
     fail-fast: false
     matrix:
       python-version: ["3.11", "3.12", "3.13", "3.14"]
   steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installation dépendances et lancement des tests
        run: |
          echo "Création de l'environnement python"
          python -m venv python_env
          . python_env/bin/activate
          python -m pip install --upgrade pip
          
          echo "Installation des dépendances via pip"
          python -m pip install -r requirements.txt --no-cache-dir --force-reinstall
          python -m pip install pytest pytest-cov
          
          echo "Lancement des tests du répertoire  grs/tests/integration_tests/"
          python -m pytest --tb=short -vv -s -x tests/ --cov=GRSl2bgen --cov-report=term --cov-report=html:cov_html --cov-report=xml:coverage.xml --cov-fail-under=65 --junitxml=test-results.xml
         
          # badge of develop, the default branch whose README GitHub shows; pushed to the branch
          # explicitly (the checkout is a detached HEAD), from the Python 3.12 job only (one
          # badge commit per push)
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/develop" && "${{ matrix.python-version }}" == "3.12" ]]; then
            echo "Génération du badge coverage"
            python -m pip install genbadge[coverage]
            mkdir -p badges
         
            genbadge coverage -i coverage.xml -o badges/coverage.svg

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add badges/coverage.svg

            if ! git diff --cached --quiet; then
              git commit -m "Update coverage badge [skip ci]"
              # rejected if develop moved during the run: the next push updates the badge
              git push origin HEAD:develop || echo "develop moved during the run, badge not pushed"
            fi
          fi

      - name: Résumé des tests et de la couverture
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          summary = []

          try:
              root = ET.parse('test-results.xml').getroot()
              suite = root.find('testsuite') if root.tag == 'testsuites' else root
              tests = int(suite.get('tests', 0))
              failures = int(suite.get('failures', 0))
              errors = int(suite.get('errors', 0))
              skipped = int(suite.get('skipped', 0))
              passed = tests - failures - errors - skipped
              time = float(suite.get('time', 0))
              summary += [
                  '## Tests unitaires',
                  '',
                  '| Total | Réussis | Échoués | Erreurs | Ignorés | Durée |',
                  '|---|---|---|---|---|---|',
                  f'| {tests} | {passed} | {failures} | {errors} | {skipped} | {time:.1f}s |',
              ]
          except (FileNotFoundError, ET.ParseError):
              summary += ['## Tests unitaires', '', '_pas de résultats (test-results.xml manquant)_']

          try:
              root = ET.parse('coverage.xml').getroot()
              line_rate = float(root.get('line-rate', 0)) * 100
              summary += [
                  '',
                  '## Couverture',
                  '',
                  f"**{line_rate:.1f}%** des lignes couvertes "
                  f"({root.get('lines-covered')}/{root.get('lines-valid')})",
              ]
          except (FileNotFoundError, ET.ParseError):
              summary += ['', '## Couverture', '', '_pas de rapport (coverage.xml manquant)_']

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(summary) + '\n')
          PY

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()   # Upload même si les tests échouent
        with:
          name: test-reports-${{ matrix.python-version }}
          path : |
            test-results.xml
            coverage.xml
            cov_html/
          retention-days: 1


# =============================================================================
# package — Publication sur Pypi
# =============================================================================
  pypi:
    needs: python-tests
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name : Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publication sur Pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}


# =============================================================================
# package — Build & Publication sur Docker Hub
# =============================================================================
  podman-build:
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Les runners GitHub-hosted embarquent plusieurs Go de toolchains préinstallées non
        # utilisées ici (.NET, Android, Haskell, Swift) ainsi que des Go d'images container
        # inutilisées ; on les retire par anticipation pour garder de la marge au build podman.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Build image
        run: |
          echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}"
          export VERSION_OBS2CO=$(grep "^__version__" GRSl2bgen/__init__.py | cut -d"'" -f 2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag : $GITHUB_REF_NAME"
            export VERSION_OBS2CO=${GITHUB_REF_NAME};
          fi
          echo "Version OBS2CO -> ${VERSION_OBS2CO}"
          
          podman build \
            --network=host \
            --build-arg IMAGE_SOURCE="" \
            --build-arg no_proxy=cnes.fr \
            --file Dockerfile \
            --tag "${DOCKER_IMAGE_NAME}:${VERSION_OBS2CO}" \
            --tag "${DOCKER_IMAGE_NAME}:latest"
          echo "Build terminé"

      - name: Publication des images sur docker Hub
        if: github.ref_type == 'tag'
        run: |
          echo "On se loggue à docker.io"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io \
              -u "${{ secrets.DOCKERHUB_LOGIN }}" \
              --password-stdin
         
          echo "Tag de l'image pour docker.io"
          echo "podman tag ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}"
           
          podman tag ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}
          podman tag ${DOCKER_IMAGE_NAME}:latest docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:latest
          
          echo "Publication vers docker.io de ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}"
          podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}
          echo "Publication vers docker.io de ${DOCKER_IMAGE_NAME}:latest"
          podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:latest
          echo "Images publiées"

# =============================================================================
# quality
# =============================================================================
  lint:
    if: github.event_name == 'pull_request' || github.ref_type == 'tag'
    needs: podman-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name : Install ruff and mypi
        run: pip install ruff mypy

      - name: Run ruff
        continue-on-error: true
        run: ruff check . --output-format=json > ruff-report.json

      - run: pip install -r requirements.txt

      - name: Run mypy
        continue-on-error: true
        run: mypy . --junit-xml mypy-report.xml
      
      - name: Upload reports   
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            ruff-report.json
            mypy-report.xml
          retention-days: 1


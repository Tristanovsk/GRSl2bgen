name: Pipeline documentation

on:
  push:
    branches:
      - 'feature/*'
      - main
      - develop
    tags:
      - '*'

# the documentation is published by Read the Docs (.readthedocs.yaml); this job only checks
# that it builds
permissions:
  contents: read

jobs:

# =============================================================================
# Documentation
# =============================================================================

  doc:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt --no-cache-dir
          python -m pip install .

      - name: Compiler la documentation Sphinx en HTML
        run: |
          cd docs
          make html

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: documentation
          path: |
            docs/build/html/
          retention-days: 1

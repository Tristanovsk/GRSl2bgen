name: grs
channels:
  - conda-forge
  - default
dependencies:
  - gdal
  - dask
  - xarray
  - zarr
  - rioxarray
  - pip>=20.1  # pip is needed as dependency
  - pip:
    - geopandas
    - jupyter
    - cartopy
    - importlib_resources
    - xmltodict
    - docopt
    - netCDF4
    - numba
    - numpy
    - pandas
    - -r requirements.txt
# pyproject.toml
[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GRSl2bgen"
dynamic = ["version", "dependencies"]
description = "Scientific code to process GRS L2A images"
readme = "README.md"
authors = [{ name = "Tristan Harmel", email = "tristan.harmel@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = ["Sentinel-2","Landsat-8","Landsat-9","water quality", "EO satellite"]
# zarr 3 needs Python 3.11
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["GRSl2bgen*"]

[tool.setuptools.package-data]
"GRSl2bgen" = ["data/*.json", "data/*.csv", "data/*.nc", "data/*.txt"]

[tool.setuptools.exclude-package-data]
"*" = [".gitattributes"]

[project.scripts]
GRSl2bgen = "GRSl2bgen.run:main"
# legacy name, kept for existing callers of the Docker image
obs2co_l2bgen = "GRSl2bgen.run:main"

[tool.setuptools.dynamic]
version = { attr = "GRSl2bgen.__version__" }
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
dev = ["black", "bumpver", "isort", "pip-tools", "pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/Tristanovsk/GRSl2bgen"
Documentation = "https://grsl2bgen.readthedocs.io"